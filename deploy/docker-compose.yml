name: mablegame

services:
  web:
    image: ${REGISTRY:-mini.local/registry}/mablegame-web:${TAG:?TAG required}
    restart: unless-stopped
    ports:
      - "${PUBLISH:-127.0.0.1:8681}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/game/mable/"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
